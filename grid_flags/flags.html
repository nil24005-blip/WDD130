<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Flags - WDD 130</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-weight: normal;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 300px 1fr;
            justify-items: center;
            align-items: center;
            row-gap: 15px;
            padding: 20px;
        }

        h2 {
            grid-column: 1 / 4;
            margin: 10px 0 0;
        }

        hr {
            grid-column: 1 / 4;
            width: 100%;
            border: 0;
            border-top: 1px solid #aaa;
        }

        /* CHILE */
        #chile {
            grid-column: 2;
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: 1fr 1fr;
            width: 300px;
            height: 200px;
        }

        #blue {
            background: #0039a6;
            grid-column: 1;
            grid-row: 1;
            display: grid;
            place-items: center;
        }

        #white {
            background: white;
            grid-column: 2;
            grid-row: 1;
        }

        #red {
            background: #d52b1e;
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .star {
            width: 45px;
            aspect-ratio: 1;
            background: white;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 93%, 50% 72%, 21% 93%, 32% 57%,
                2% 35%, 39% 35%
            );
        }

        /* DENMARK */
        #denmark {
            grid-column: 2;
            display: grid;
            grid-template-columns: 30% 10% 60%;
            grid-template-rows: 45% 10% 45%;
            width: 300px;
            height: 200px;
            background: #c8102e;
        }

        #dred1 {
            grid-column: 1;
            grid-row: 1;
        }

        #dred2 {
            background: white;
            grid-column: 2;
            grid-row: 1 / 4;
        }

        #dred3 {
            background: white;
            grid-column: 1 / 4;
            grid-row: 2;
        }

        #dred4 {
            grid-column: 3;
            grid-row: 3;
        }

        /* FINLAND */
        #finland {
            grid-column: 2;
            display: grid;
            grid-template-columns: 30% 15% 55%;
            grid-template-rows: 40% 20% 40%;
            width: 300px;
            height: 200px;
            background: white;
        }

        #fwhite1 {
            grid-column: 1;
            grid-row: 1;
        }

        #fwhite2 {
            background: #003580;
            grid-column: 2;
            grid-row: 1 / 4;
        }

        #fwhite3 {
            background: #003580;
            grid-column: 1 / 4;
            grid-row: 2;
        }

        #fwhite4 {
            grid-column: 3;
            grid-row: 3;
        }

        /* BENIN */
        #benin {
            grid-column: 2;
            display: grid;
            grid-template-columns: 40% 60%;
            grid-template-rows: 1fr 1fr;
            width: 300px;
            height: 200px;
        }

        #bgreen {
            background: #008751;
            grid-column: 1;
            grid-row: 1 / 3;
        }

        #byellow {
            background: #fcd116;
            grid-column: 2;
            grid-row: 1;
        }

        #bred {
            background: #e8112d;
            grid-column: 2;
            grid-row: 2;
        }

        /* ITALY - BONUS */
        #italy {
            grid-column: 2;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 300px;
            height: 200px;
        }

        #igreen {
            background: #009246;
        }

        #iwhite {
            background: white;
        }

        #ired {
            background: #ce2b37;
        }

        /* CENTRAL AFRICAN REPUBLIC - BONUS */
        #car {
            grid-column: 2;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            width: 300px;
            height: 200px;
            position: relative;
        }

        #carblue {
            background: #003082;
            grid-column: 1 / 4;
            grid-row: 1;
        }

        #carwhite {
            background: white;
            grid-column: 1 / 4;
            grid-row: 2;
        }

        #cargreen {
            background: #289728;
            grid-column: 1 / 4;
            grid-row: 3;
        }

        #caryellow {
            background: #ffce00;
            grid-column: 1 / 4;
            grid-row: 4;
        }

        #carred {
            background: #d21034;
            grid-column: 2;
            grid-row: 1 / 5;
        }

        #carstar {
            position: absolute;
            top: 5px;
            left: 25px;
            width: 35px;
            height: 35px;
            background: #ffce00;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%,
                79% 93%, 50% 72%, 21% 93%, 32% 57%,
                2% 35%, 39% 35%
            );
            z-index: 1;
        }
    </style>
</head>

<body>
    <header>
        <h1>Using CSS Grid to Make Country Flags</h1>
    </header>

    <main>
        <h2>Chile</h2>
        <div id="chile">
            <div id="blue">
                <div class="star"></div>
            </div>
            <div id="white"></div>
            <div id="red"></div>
        </div>
        <hr>

        <h2>Denmark</h2>
        <div id="denmark">
            <div id="dred1"></div>
            <div id="dred2"></div>
            <div id="dred3"></div>
            <div id="dred4"></div>
        </div>
        <hr>

        <h2>Finland</h2>
        <div id="finland">
            <div id="fwhite1"></div>
            <div id="fwhite2"></div>
            <div id="fwhite3"></div>
            <div id="fwhite4"></div>
        </div>
        <hr>

        <h2>Benin</h2>
        <div id="benin">
            <div id="bgreen"></div>
            <div id="byellow"></div>
            <div id="bred"></div>
        </div>
        <hr>

        <h2>Italy - Bonus</h2>
        <div id="italy">
            <div id="igreen"></div>
            <div id="iwhite"></div>
            <div id="ired"></div>
        </div>
        <hr>

        <h2>Central African Republic - Bonus</h2>
        <div id="car">
            <div id="carblue"></div>
            <div id="carwhite"></div>
            <div id="cargreen"></div>
            <div id="caryellow"></div>
            <div id="carred"></div>
            <div id="carstar"></div>
        </div>
    </main>
</body>
</html>
